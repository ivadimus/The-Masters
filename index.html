:root {
    --ds-page: #0f2d19;
    --ds-ink: #f4f4f5;
    --ds-ink-2: rgba(244, 244, 245, .72);
    --ds-hairline: rgba(244, 244, 245, .18);
    
    --ds-teal: #BEAC96;
    color-scheme: dark;
}

html,
body {
    background: #0f2d19;
    font-family: "Heebo", Arial, sans-serif;
}

body {
    isolation: isolate;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        linear-gradient(to bottom, #000 0%, rgba(0,0,0,0) 16%, rgba(0,0,0,0) 84%, #000 100%),
        linear-gradient(to right, #000 0%, rgba(0,0,0,0) 12%, rgba(0,0,0,0) 88%, #000 100%),
        radial-gradient(ellipse at center, rgba(0,0,0,0) 46%, #000 100%);
}

.file-card {
    border: none;
    gap: 26px;
    padding-top: 20px;
    padding-bottom: 20px;
}

.brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
}



.send-action {
    display: flex;
    justify-content: center;
}

.send-action .file-button {
    background: #BEAC96;
    border-color: #BEAC96;
    color: #251f21;
    min-height: 48px;
    width: min(480px, 100%);
    padding: 0 48px;
    font-size: 16px;
    font-weight: 700;
}

.archive-link {
    align-self: center;
    background: transparent;
    border: 0;
    color: #BEAC96;
    font: inherit;
    font-size: 15px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
}

.archive-head {
    margin: 0;
    text-align: center;
    font-size: 22px;
    color: #f4f4f5;
}

.archive-table {
    width: 100%;
    border-collapse: collapse;
}

.archive-table td {
    padding: 12px 2px;
    border-bottom: 1px solid rgba(244, 244, 245, .28);
    vertical-align: middle;
}

.archive-name {
    text-align: right;
    font-size: 16px;
    line-height: 1.3;
}

.archive-table td:last-child {
    width: 1%;
    white-space: nowrap;
    text-align: left;
}

.archive-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
}

#archive .archive-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    min-width: 36px;
    height: 32px;
    min-height: 32px;
    padding: 0;
    border-radius: 10px;
}

#archive .archive-icon svg {
    width: 18px;
    height: 18px;
    display: block;
}

#archive .archive-delete {
    margin-inline-end: 18px;
    background: #c4453c !important;
    border-color: #c4453c !important;
    color: #fff !important;
}

#archive-back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    direction: ltr;
}

.archive-frame {
    width: 100%;
    height: 70vh;
    border: 0;
    border-radius: 8px;
    background: #fff;
}

.archive-empty {
    margin: 0;
    text-align: center;
}


.field-error {
    margin: 0;
    color: #f3d7c8;
    font-size: 14px;
}

.send-section {
    margin-top: 72px;
}

.form-screen {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: transparent;
}

.form-shell {
    flex: 1 1 auto;
    min-height: 0;
    height: auto;
    max-height: none;
    margin-bottom: 0;
    overflow: hidden;
}

.form-head,
.form-foot {
    flex: 0 0 auto;
}

.form-foot.send-section,
.form-dock.send-section {
    margin-top: 22px;
    padding-bottom: 28px;
}

.form-dock {
    flex: 0 0 auto;
    width: min(1040px, calc(100% - 48px));
    margin: 18px auto 0;
    padding-bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.form-dock .status {
    margin: 0;
    min-height: 0;
    text-align: center;
}

.form-dock .status:empty {
    display: none;
}

@media (max-width: 768px) {
    .form-dock {
        width: calc(100% - 24px);
        margin-top: 14px;
        margin-bottom: 0;
        padding-bottom: 0;
    }

    .form-dock.send-section {
        padding-bottom: 48px;
    }
}

.scroll-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: row;
    direction: ltr;
    align-items: stretch;
}

.form-scroll {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    direction: rtl;
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-width: none;
}

.form-scroll::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
}

.form-head {
    position: relative;
}

.home-btn,
.logo-home {
    border: 0;
    background: transparent;
    padding: 0;
    cursor: pointer;
    color: #BEAC96;
}

.home-btn {
    position: absolute;
    top: 0;
    right: 0;
    z-index: 3;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.home-crown {
    width: 34px;
    height: auto;
    display: block;
    pointer-events: none;
}

@media (max-width: 768px) {
    .home-crown {
        width: 24px;
    }
}

.logo-home,
#home-logo {
    display: block;
    width: min(211px, 58%);
}

.home-screen {
    min-height: 100dvh;
    background: transparent;
}

.home-card {
    width: min(640px, calc(100% - 48px));
}

.doc-list {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}

.doc-btn {
    width: min(460px, 82%);
    min-height: 64px;
    padding: 14px 18px;
    border: 1px solid #ffffff;
    border-radius: 16px;
    background: transparent;
    color: #f4f4f5;
    font: inherit;
    font-size: 18px;
    font-weight: 400;
    line-height: 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
}

.doc-btn.is-done {
    border: 1px solid #BEAC96;
    color: #BEAC96;
    font-weight: 700;
}

.doc-dl svg {
    width: 22px;
    height: 22px;
    display: block;
}

.home-daily {
    width: min(460px, 82%);
    align-self: center;
    min-height: 56px;
}

.home-archive {
    align-self: center;
    min-height: 48px;
    border: 0;
    background: transparent;
    color: #BEAC96;
    font: inherit;
    font-size: 18px;
    cursor: pointer;
}

@media (max-width: 768px) {
    .home-card {
        width: calc(100% - 24px);
    }
}

.head-date {
    margin: 0;
    text-align: center;
    color: #f4f4f5;
    font-size: 16px;
    line-height: 22px;
    font-weight: 500;
}

.progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
}

.progress-row .progress-track {
    flex: 1 1 auto;
    margin: 0;
}

.progress-count {
    flex: 0 0 auto;
    min-width: 46px;
    color: #BEAC96;
    font-size: 15px;
    font-weight: 700;
    text-align: center;
}


.problem-box {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    min-width: 26px;
    min-height: 26px;
    margin-top: 1px;
    border: 2px solid #c4453c;
    border-radius: 6px;
    background: transparent;
    color: #c4453c;
    font-size: 16px;
    font-weight: 700;
    line-height: 1;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.problem-note {
    display: block;
    width: 100%;
    min-height: 76px;
    margin: 4px 0 10px;
    padding: 12px;
    box-sizing: border-box;
    resize: vertical;
    background: #1d1d22;
    border: 1px solid #c4453c;
    border-radius: 10px;
    color: #f4f4f5;
    font: inherit;
    font-size: 16px;
    line-height: 22px;
}

.problem-note::placeholder {
    color: rgba(244, 244, 245, .45);
}

.pager {
    justify-content: center;
}

#build {
    width: min(220px, 68%);
    min-height: 36px;
    padding: 0 20px;
    font-size: 15px;
}

.pager {
    display: flex;
    direction: rtl;
    justify-content: center;
    align-items: center;
    gap: 12px;
    width: 100%;
}

.pager .file-button {
    min-height: 48px;
    width: auto;
    min-width: 132px;
    padding: 0 28px;
    font-size: 16px;
    font-weight: 700;
}

.pager .pager-arrow {
    min-width: 56px;
    width: 56px;
    padding: 0;
    font-size: 22px;
    line-height: 1;
    direction: ltr;
}

#build.send-disabled,
#build:disabled,
#next.send-disabled {
    background: #8d8d8d !important;
    border: 2px solid #8d8d8d !important;
    color: #2a2a2a !important;
    cursor: default;
}

.brand-logo {
    width: 100%;
    height: auto;
    display: block;
}

.brand-title {
    margin: 0;
    font-size: 22px;
    line-height: 28px;
    font-weight: 600;
    color: #BEAC96;
}

.fields {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.field-label {
    font-size: 14px;
    line-height: 20px;
    color: var(--ds-ink-2);
}

.field-input {
    font: inherit;
    font-size: 18px;
    line-height: 24px;
    color: var(--ds-ink);
    background: transparent;
    border: 1px solid var(--ds-hairline);
    border-radius: 4px;
    padding: 10px 12px;
    min-height: 48px;
    box-sizing: border-box;
    width: 100%;
}

.field-input::placeholder {
    color: rgba(244, 244, 245, .48);
}

.date-line {
    display: block;
    padding: 6px 0;
    color: var(--ds-ink);
}

.date-line-label {
    font-size: 22px;
    line-height: 28px;
    font-weight: 600;
}

.date-line-value {
    font-size: 18px;
    line-height: 24px;
}

.field-input:focus-visible {
    outline: 2px solid var(--ds-teal);
    outline-offset: 1px;
}

.print-fields {
    display: none;
}

.check-list {
    display: flex;
    flex-direction: column;
}

.list-rule {
    height: 1px;
    margin: 18px 0 0;
    border: 0;
    background: #ffffff;
}

#sign-section {
    margin-top: 40px;
}

#sign-section h2 {
    margin: 0;
    font-family: inherit;
    font-size: 1em;
    font-weight: 400;
    line-height: normal;
}

.check-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 4px;
    min-height: 44px;
    box-sizing: border-box;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    border-radius: 4px;
}

.check-item:focus-visible {
    outline: 2px solid var(--ds-teal);
    outline-offset: 1px;
}

.check-box {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    margin-top: 1px;
    border: 2px solid var(--ds-ink-2);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
}

.check-item[data-checked="true"] .check-box {
    background: #BEAC96;
    border-color: #BEAC96;
    color: #111111;
}

.check-item[data-checked="true"] .check-box::after {
    content: "";
    width: 7px;
    height: 12px;
    margin-top: -4px;
    border-right: 4px solid #111111;
    border-bottom: 4px solid #111111;
    transform: rotate(45deg);
}

.check-item[data-checked="true"] .check-text {
    font-weight: 600;
}

.check-text {
    flex: 1;
    font-size: 16px;
    line-height: 26px;
    color: var(--ds-ink);
}

.sub-list {
    margin: 0;
    padding: 0 42px 8px 4px;
    list-style: disc;
    color: var(--ds-ink-2);
    font-size: 16px;
    line-height: 26px;
}

.sig-canvas {
    display: block;
    width: 100%;
    height: 180px;
    border: 1px solid var(--ds-hairline);
    border-radius: 8px;
    touch-action: none;
    background: #BEAC96;
}

.sig-line {
    height: 1px;
    background: #251f21;
    margin: -28px 16px 28px 16px;
    pointer-events: none;
}

.sig-actions {
    margin-top: 8px;
    display: flex;
    gap: 8px;
}

.sig-actions .file-button {
    min-height: 44px;
    padding: 0 20px;
}

.sig-clear-actions {
    margin-top: 56px;
}

.sig-clear-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.sig-clear-row .caption {
    margin: 0;
    color: #ffffff;
}

#clear.file-button {
    background: #ffffff !important;
    border-color: #ffffff !important;
    color: #17171a !important;
    min-height: 32px;
    padding: 0 12px;
    font-size: 13px;
}

#back {
    background: #ffffff !important;
    border-color: #ffffff !important;
    color: #17171a !important;
}

@media print {
    @page {
        size: A4;
        margin: 14mm;
    }

    :root {
        --ds-page: #ffffff;
        --ds-ink: #251f21;
        --ds-ink-2: #585254;
        --ds-hairline: #eae9ea;
        color-scheme: light;
    }

    body {
        background: #ffffff;
    }

    .brand-logo {
        filter: invert(1) hue-rotate(180deg);
    }

    .no-print {
        display: none !important;
    }

    .fields {
        display: none;
    }

    .print-fields {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
        line-height: 24px;
    }

    .print-field-label {
        font-weight: 600;
    }

    .check-item,
    .check-box,
    .check-item[data-checked="true"] .check-box {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .check-item {
        cursor: default;
        break-inside: avoid;
    }

    .sig-canvas {
        break-inside: avoid;
    }
}

.export-section {
    margin-top: 22px;
}

.export-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 2px;
}

.export-note {
    text-align: center;
}

.export-note > * {
    font-size: 15px;
    line-height: 22px;
    color: #d9cdb9;
}

.archive-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.archive-actions .file-button {
    min-width: 0;
}

@media (max-width: 700px) {
    .print-action {
        display: none;
    }

}

.file-button:not([data-variant="primary"]):not([data-variant="ghost"]) {
    background: #1d1d21;
    color: var(--ds-ink);
    border-color: var(--ds-hairline);
}

.report-address {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
}

.report-address-label {
    font-size: 12px;
    line-height: 20px;
    color: var(--ds-ink-2);
}

.report-address-value {
    font-size: 14px;
    line-height: 24px;
    font-weight: 600;
    color: var(--ds-ink);
}


.archive-actions .file-button[data-variant="secondary"],
.archive-actions .archive-link {
    border-color: #BEAC96;
}

.archive-actions .file-button[data-variant="secondary"][disabled] {
    color: #838386;
    background: transparent;
    opacity: 1;
    cursor: default;
}


.reset-actions {
    margin-top: 8px;
}

.reset-actions .file-button {
    background: #f4f4f5;
    border-color: #f4f4f5;
    color: #17171a;
    min-height: 32px;
    padding: 0 14px;
    font-size: 13px;
}

.field-error {
    display: block;
    margin-top: 6px;
    font-size: 13px;
    line-height: 18px;
    color: #e8b4b4;
}


.progress-track {
    position: relative;
    height: 8px;
    margin: 2px 0 16px;
    border-radius: 999px;
    background: #082116;
    overflow: hidden;
}

.progress-fill {
    position: absolute;
    top: 0;
    bottom: 0;
    right: 0;
    width: 0%;
    background: #BEAC96;
    transition: width .35s ease;
}


.name-field-wrap {
    position: relative;
}

.name-history {
    position: absolute;
    inset-inline: 0;
    top: calc(100% + 4px);
    background: #232327;
    border: 1px solid #3a3a40;
    border-radius: 10px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 20;
}

.name-history-item {
    display: block;
    width: 100%;
    text-align: right;
    background: transparent;
    border: 0;
    color: #e8e8ea;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    line-height: 20px;
    cursor: pointer;
}

.name-history-item:hover {
    background: #2f2f35;
}

.name-history-item:focus-visible {
    background: #2f2f35;
    outline: 2px solid #BEAC96;
    outline-offset: -2px;
}


button.file-button {
    border-radius: 999px;
}

.reopen-link {
    color: #BEAC96;
    text-decoration: underline;

function pdfFileName(){return "צ'קליסט פתיחת חנות ROLEX "+dateLabel().replaceAll('/','.')+".pdf";}
function archiveDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open('rolex-checklist',1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('pdfs'))db.createObjectStore('pdfs',{keyPath:'date'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function savePdf(file){const db=await archiveDb();await new Promise((resolve,reject)=>{const tx=db.transaction('pdfs','readwrite');tx.objectStore('pdfs').put({date:dateLabel(),name:file.name,blob:file,savedAt:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});db.close();}
async function listPdfs(){const db=await archiveDb();const rows=await new Promise((resolve,reject)=>{const req=db.transaction('pdfs','readonly').objectStore('pdfs').getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);});db.close();return rows.sort((a,b)=>b.date.split('/').reverse().join('').localeCompare(a.date.split('/').reverse().join('')));}
let archivePreviewUrl='';
function viewPdf(blob){if(archivePreviewUrl)URL.revokeObjectURL(archivePreviewUrl);archivePreviewUrl=URL.createObjectURL(blob);const frame=byId('archive-frame');frame.hidden=false;frame.src=archivePreviewUrl;frame.scrollIntoView({block:'start'});}
function downloadPdf(blob,name){const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(href),1000);}
async function deletePdf(date){const db=await archiveDb();await new Promise((resolve,reject)=>{const tx=db.transaction('pdfs','readwrite');tx.objectStore('pdfs').delete(date);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});db.close();byId('archive-frame').hidden=true;await renderArchive();}
const archiveEye='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
const archiveDown='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const archiveTrash='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V5h6v2M8 7l1 13h6l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function archiveLabel(date){return 'Checklist '+date.replaceAll('/','.');}
async function renderArchive(){const rows=await listPdfs();const body=byId('archive-rows');body.replaceChildren();byId('archive-empty').hidden=rows.length>0;byId('archive-table').hidden=rows.length===0;for(const row of rows){const label=archiveLabel(row.date);const tr=document.createElement('tr');const file=document.createElement('td');file.className='archive-name';file.textContent=label;const actions=document.createElement('td');const wrap=document.createElement('div');wrap.className='archive-actions';const view=document.createElement('button');view.type='button';view.className='file-button archive-icon';view.setAttribute('aria-label','צפייה');view.innerHTML=archiveEye;view.onclick=()=>viewPdf(row.blob);const down=document.createElement('button');down.type='button';down.className='file-button archive-icon';down.setAttribute('aria-label','הורדה');down.innerHTML=archiveDown;down.onclick=()=>downloadPdf(row.blob,label+'.pdf');const del=document.createElement('button');del.type='button';del.className='file-button archive-icon archive-delete';del.setAttribute('aria-label','מחיקה');del.innerHTML=archiveTrash;del.onclick=()=>deletePdf(row.date).catch(()=>{});wrap.append(del,view,down);actions.append(wrap);tr.append(file,actions);body.append(tr);}}
async function showArchive(){byId('home-screen').hidden=true;byId('form-screen').hidden=true;byId('form').hidden=true;byId('report').hidden=true;byId('archive').hidden=false;byId('archive-frame').hidden=true;await renderArchive();window.scrollTo(0,0);}
byId('archive-back').onclick=()=>showHome();
async function sendChecklistEmail(pdfFile, employeeName){
  const data=new FormData();
  data.append("_subject", "צ'קליסט פתיחת חנות ROLEX "+dateLabel());
  data.append("_captcha", "false");
  data.append("_template", "box");
  data.append("שם העובד", employeeName);
  const logoBlob=await (await fetch(logo.src)).blob();
  data.append("attachment", new File([logoBlob], "the-masters-logo.png", {type:logoBlob.type||"image/png"}));
  data.append("attachment", pdfFile, pdfFile.name);
  const res=await fetch("https://formsubmit.co/ajax/ivadimus@gmail.com", {method:"POST", headers:{Accept:"application/json"}, body:data, referrerPolicy:"origin"});
  const payload=await res.json().catch(()=>({}));
  if(!res.ok || !/^true$/i.test(String(payload.success))){
    const message=String(payload.message||"");
    if(/activat/i.test(message)) throw new Error("activation");
    if(/web server|html file/i.test(message)) throw new Error("file");
    throw new Error("send");
  }
}
function nameIsValid(value){const name=value.trim();if(!/^[\p{L}][\p{L} .'-]*[\p{L}]$/u.test(name))return false;const letters=name.match(/\p{L}/gu)||[];if(letters.length<=3)return false;if(/(.)\1/u.test(letters.join('')))return false;if(/^\d+$/.test(name))return false;return true;}
function formReady(){return nameIsValid(byId('name').value)&&checks[step].every((_,i)=>itemDone(step,i))&&!!ink;}
function refreshSend(){const ready=formReady();byId('build').classList.toggle('send-disabled',!ready);byId('build').setAttribute('aria-disabled',String(!ready));if(ready&&byId('form-note').textContent==='נא למלא את כל הפרטים')byId('form-note').textContent='';}
byId('name').oninput=()=>{if(rollDay())return;const value=byId('name').value.trim();byId('name-error').hidden=!value||nameIsValid(value);names[step]=byId('name').value;submitted[step]=false;persist();refreshSend();renderDocs();};
async function sigImage(src){if(!src)return null;const img=new Image();img.src=src;await img.decode();return img;}
async function buildForms(indexes){capturePage();await logo.decode();const forms=[];for(const pi of indexes){forms.push({title:pages[pi].title,items:pages[pi].items,checks:checks[pi],problems:problems[pi],notes:notes[pi],name:(names[pi]||'').trim(),signature:await sigImage(signatures[pi])});}return ChecklistPdf.buildChecklistReport({dateLabel:dateLabel(),logo,forms});}
async function downloadForm(pi){const report=await buildForms([pi]);downloadPdf(report.blob,'Checklist '+menuLabels[pi]+' '+dateLabel().replaceAll('/','.')+'.pdf');}
async function downloadDaily(){const report=await buildForms(pages.map((_,i)=>i));const name=archiveLabel(dateLabel())+'.pdf';downloadPdf(report.blob,name);try{await savePdf(new File([report.blob],name,{type:'application/pdf'}));}catch(e){}}
byId('build').onclick=async()=>{if(rollDay())return;capturePage();const name=byId('name').value.trim();if(!formReady()){byId('name-error').hidden=nameIsValid(name);byId('form-note').textContent='נא למלא את כל הפרטים';return;}submitted[step]=true;persist();if(!submitted.every(Boolean)){showHome();return;}byId('build').disabled=true;try{const report=await buildForms(pages.map((_,i)=>i));const file=new File([report.blob],archiveLabel(dateLabel())+'.pdf',{type:'application/pdf'});await savePdf(file);showHome();}catch(e){byId('form-note').textContent='השמירה נכשלה';}finally{byId('build').disabled=false;refreshSend();}};
byId('share').onclick=async()=>{try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[pdf]}))await navigator.share({files:[pdf],title:"צ'קליסט פתיחת חנות ROLEX"});}catch(e){}};
byId('print').onclick=()=>window.print();byId('back').onclick=()=>{byId('report').hidden=true;byId('archive').hidden=true;showHome();};byId('home-btn').onclick=showHome;byId('logo-home').onclick=showHome;byId('home-logo').onclick=showHome;byId('home-archive').onclick=()=>showArchive().catch(()=>{});byId('home-daily').onclick=()=>downloadDaily().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')rollDay();});window.addEventListener('focus',rollDay);window.addEventListener('pageshow',rollDay);setInterval(rollDay,60000);dropOldDays();loadDay();showHome();makeLogoTransparent();
</script></body></html>
