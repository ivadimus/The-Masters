:root {
    --ds-page: #101013;
    --ds-ink: #f4f4f5;
    --ds-ink-2: rgba(244, 244, 245, .72);

}

body {
    background: #0a0a0c;
}

.file-card {
    gap: 26px;
    padding-top: 20px;
    padding-bottom: 20px;
}

.brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
}



.send-action {
    display: flex;
    justify-content: center;
}

.send-action .file-button {
    background: #BEAC96;
    border-color: #BEAC96;
    color: #251f21;
    min-height: 48px;
    width: min(480px, 100%);
    padding: 0 48px;
    font-size: 16px;
    font-weight: 700;
}

.archive-link {
    align-self: center;
    background: transparent;
    border: 0;
    color: #BEAC96;
    font: inherit;
    font-size: 15px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
}

.archive-head {
    margin: 0;
    text-align: center;
    font-size: 22px;
    color: #f4f4f5;
}

.archive-table {
    width: 100%;
    border-collapse: collapse;
}

.archive-table td {
    padding: 12px 2px;
    border-bottom: 1px solid rgba(244, 244, 245, .28);
    vertical-align: middle;
}

.archive-name {
    text-align: right;
    font-size: 16px;
    line-height: 1.3;
}

.archive-table td:last-child {
    width: 1%;
    white-space: nowrap;
    text-align: left;
}

.archive-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
}

#archive .archive-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    min-width: 36px;
    height: 32px;
    min-height: 32px;
    padding: 0;
    border-radius: 10px;
}

#archive .archive-icon svg {
    width: 18px;
    height: 18px;
    display: block;
}

#archive .archive-delete {
    margin-inline-end: 18px;
    background: #c4453c !important;
    border-color: #c4453c !important;
    color: #fff !important;
}

#archive-back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    direction: ltr;
}

.archive-frame {
    width: 100%;
    height: 70vh;
    border: 0;
    border-radius: 8px;
    background: #fff;
}

.archive-empty {
    margin: 0;
    text-align: center;
}


.field-error {
    margin: 0;
    color: #f3d7c8;
    font-size: 14px;
}

.send-section {
    margin-top: 72px;
}

.form-screen {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.form-shell {
    flex: 1 1 auto;
    min-height: 0;
    height: auto;
    max-height: none;
    margin-bottom: 0;
    overflow: hidden;
}

.form-head,
.form-foot {
    flex: 0 0 auto;
}

.form-foot.send-section,
.form-dock.send-section {
    margin-top: 0;
}

.form-dock {
    flex: 0 0 auto;
    width: min(1040px, calc(100% - 48px));
    margin: 8px auto 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.form-dock .status {
    margin: 0;
    min-height: 0;
    text-align: center;
}

.form-dock .status:empty {
    display: none;
}

@media (max-width: 768px) {
    .form-dock {
        width: calc(100% - 24px);
        margin-bottom: 8px;
    }
}

.scroll-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: row;
    direction: ltr;
    align-items: stretch;
    gap: 8px;
}

.scroll-bar {
    flex: 0 0 10px;
    width: 10px;
    margin: 2px 0;
    background: #2a2a30;
    border-radius: 999px;
    position: relative;
    touch-action: none;
    cursor: pointer;
}

.scroll-thumb {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 36px;
    background: #BEAC96;
    border-radius: 999px;
}

.form-scroll {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    direction: rtl;
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-width: none;
}

.form-scroll::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
}

.form-head {
    position: relative;
}

.menu-toggle {
    position: absolute;
    top: 0;
    right: 0;
    z-index: 3;
    width: 48px;
    height: 48px;
    padding: 0;
    border: 0;
    background: transparent;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    cursor: pointer;
}

.menu-toggle span {
    display: block;
    width: 22px;
    height: 2px;
    border-radius: 2px;
    background: #BEAC96;
}

.head-date {
    margin: 0;
    text-align: center;
    color: #f4f4f5;
    font-size: 16px;
    line-height: 22px;
    font-weight: 500;
}

.progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
}

.progress-row .progress-track {
    flex: 1 1 auto;
    margin: 0;
}

.progress-count {
    flex: 0 0 auto;
    min-width: 46px;
    color: #BEAC96;
    font-size: 15px;
    font-weight: 700;
    text-align: center;
}

.nav-menu {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: #0a0a0c;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 20px 18px 28px;
    overflow: auto;
}

.menu-close {
    align-self: flex-end;
    width: 52px;
    height: 52px;
    border: 0;
    border-radius: 14px;
    background: transparent;
    color: #f4f4f5;
    font-size: 36px;
    line-height: 1;
    cursor: pointer;
}

.menu-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.menu-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.menu-open {
    flex: 1 1 auto;
    min-height: 64px;
    padding: 14px 8px;
    border: 0;
    background: transparent;
    color: #f4f4f5;
    font: inherit;
    font-size: 22px;
    font-weight: 300;
    line-height: 30px;
    text-align: right;
    cursor: pointer;
}

.menu-open.is-done {
    color: #BEAC96;
    font-weight: 700;
}

.menu-dl {
    width: 52px;
    min-width: 52px;
    height: 52px;
    padding: 0;
}

.menu-dl svg {
    width: 22px;
    height: 22px;
    display: block;
    margin: 0 auto;
}

#daily-report {
    width: 100%;
    min-height: 60px;
    margin-top: 8px;
}

@media (min-width: 769px) {
    .nav-menu {
        inset: auto;
        width: max-content;
        max-width: calc(100vw - 24px);
        max-height: calc(100dvh - 80px);
        padding: 8px;
        gap: 4px;
        background: #16161a;
        border: 1px solid #303036;
        border-radius: 16px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
        transform-origin: top right;
        overflow: auto;
    }

    .nav-menu.is-open {
        animation: menu-from-corner .22s ease both;
    }

    .nav-menu.is-closing {
        animation: menu-to-corner .18s ease both;
        pointer-events: none;
    }

    .menu-close {
        display: none;
    }

    .menu-list {
        gap: 2px;
    }

    .menu-row {
        gap: 8px;
    }

    .menu-open {
        flex: 0 0 auto;
        min-height: 44px;
        padding: 8px 12px;
        font-size: 16px;
        line-height: 22px;
        white-space: nowrap;
    }

    .menu-dl {
        width: 40px;
        min-width: 40px;
        height: 40px;
    }

    #daily-report,
    #menu-archive {
        width: auto;
        align-self: stretch;
        min-height: 44px;
        white-space: nowrap;
    }
}

@keyframes menu-from-corner {
    from {
        opacity: 0;
        transform: scale(.12);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes menu-to-corner {
    from {
        opacity: 1;
        transform: scale(1);
    }

    to {
        opacity: 0;
        transform: scale(.12);
    }
}

@media (prefers-reduced-motion: reduce) {
    .nav-menu.is-open,
    .nav-menu.is-closing {
        animation: none;
    }
}

.problem-box {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    min-width: 26px;
    min-height: 26px;
    margin-top: 1px;
    border: 2px solid #c4453c;
    border-radius: 6px;
    background: transparent;
    color: #c4453c;
    font-size: 16px;
    font-weight: 700;
    line-height: 1;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.problem-note {
    display: block;
    width: 100%;
    min-height: 76px;

    padding: 12px;

    resize: vertical;
    background: #1d1d22;
    border: 1px solid #c4453c;
    border-radius: 10px;
    color: #f4f4f5;
    font: inherit;
    font-size: 16px;
    line-height: 22px;
}

.problem-note::placeholder {
    color: rgba(244, 244, 245, .45);
}

.pager {
    justify-content: center;
}

#build {
    width: min(480px, 100%);
}

.pager {
    display: flex;
    direction: rtl;
    justify-content: center;
    align-items: center;
    gap: 12px;
    width: 100%;
}

.pager .file-button {
    min-height: 48px;
    width: auto;
    min-width: 132px;
    padding: 0 28px;
    font-size: 16px;
    font-weight: 700;
}

.pager .pager-arrow {
    min-width: 56px;
    width: 56px;
    padding: 0;
    font-size: 22px;
    line-height: 1;
    direction: ltr;
}

#build.send-disabled,
#next.send-disabled {
    background: #3d372c !important;
    border-color: #3d372c !important;
    color: rgba(244, 244, 245, .45) !important;
    cursor: default;
}

.brand-logo {
    width: min(211px, 58%);
    height: auto;
    display: block;
}

.brand-title {
    margin: 0;
    font-size: 22px;
    line-height: 28px;
    font-weight: 600;
    color: #BEAC96;
}

.fields {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.field-label {
    font-size: 14px;
    line-height: 20px;
    color: var(--ds-ink-2);
}

.field-input {
    font: inherit;
    font-size: 18px;
    line-height: 24px;
    color: var(--ds-ink);
    background: transparent;
    border: 1px solid var(--ds-hairline);
    border-radius: 4px;
    padding: 10px 12px;
    min-height: 48px;
    box-sizing: border-box;
    width: 100%;
}

.field-input::placeholder {
    color: rgba(244, 244, 245, .48);
}

.date-line {
    display: block;
    padding: 6px 0;
    color: var(--ds-ink);
}

.date-line-label {
    font-size: 22px;
    line-height: 28px;
    font-weight: 600;
}

.date-line-value {
    font-size: 18px;
    line-height: 24px;
}

.field-input:focus-visible {
    outline: 2px solid var(--ds-teal);
    outline-offset: 1px;
}

.print-fields {
    display: none;
}

.check-list {
    display: flex;
    flex-direction: column;
}

.check-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 4px;
    min-height: 44px;
    box-sizing: border-box;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    border-radius: 4px;
}

.check-item:focus-visible {
    outline: 2px solid var(--ds-teal);
    outline-offset: 1px;
}

.check-box {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    margin-top: 1px;
    border: 2px solid var(--ds-ink-2);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
}

.check-item[data-checked="true"] .check-box {
    background: #BEAC96;
    border-color: #BEAC96;
    color: #111111;
}

.check-item[data-checked="true"] .check-box::after {
    content: "";
    width: 7px;
    height: 12px;
    margin-top: -4px;
    border-right: 4px solid #111111;
    border-bottom: 4px solid #111111;
    transform: rotate(45deg);
}

.check-item[data-checked="true"] .check-text {

}

.check-text {

    font-size: 16px;

.sig-actions {

.sig-clear-actions {

.sig-clear-row {

.sig-clear-row .caption {

#clear.file-button {

    border-color: #ffffff !important;
    color: #17171a !important;

@media print {
    @page {
        size: A4;
        margin: 14mm;
    }

    :root {
        --ds-page: #ffffff;
        --ds-ink: #251f21;
        --ds-ink-2: #585254;
        --ds-hairline: #eae9ea;

    body {

    .brand-logo {

    }

    .no-print {
        display: none !important;

    .fields {

    .print-fields {
        display: flex;

        gap: 6px;
        font-size: 14px;

    .print-field-label {
        font-weight: 600;
    }

    .check-item,
    .check-box,
    .check-item[data-checked="true"] .check-box {

.export-section {

const byId=id=>document.getElementById(id);
const menuLabels=['ROLEX פתיחה','TUDOR פתיחה','INDEPENDENT פתיחה','החלפת משמרת','ROLEX סגירה','TUDOR סגירה','INDEPENDENT סגירה'];
const checks=pages.map(page=>page.items.map(()=>false));
const problems=pages.map(page=>page.items.map(()=>false));
const notes=pages.map(page=>page.items.map(()=>''));
const names=pages.map(()=>'');
const signatures=pages.map(()=>null);
const submitted=pages.map(()=>false);
function dayKey(){return 'masters-day-'+dateLabel();}
function loadDay(){try{const data=JSON.parse(localStorage.getItem(dayKey())||'null');if(!data)return;pages.forEach((page,pi)=>{page.items.forEach((_,i)=>{checks[pi][i]=!!(data.checks&&data.checks[pi]&&data.checks[pi][i]);problems[pi][i]=!!(data.problems&&data.problems[pi]&&data.problems[pi][i]);notes[pi][i]=String((data.notes&&data.notes[pi]&&data.notes[pi][i])||'');});names[pi]=String((data.names&&data.names[pi])||'');signatures[pi]=(data.signatures&&data.signatures[pi])||null;submitted[pi]=!!(data.submitted&&data.submitted[pi]);});}catch(e){}}
function persist(){try{localStorage.setItem(dayKey(),JSON.stringify({checks,problems,notes,names,signatures,submitted}));}catch(e){}}
function capturePage(){names[step]=byId('name').value;if(ink)signatures[step]=canvas.toDataURL();}
function updateProgress(){const row=checks[step];const done=row.filter(Boolean).length;const max=row.length||1;byId('progress-fill').style.width=(done/max*100)+'%';byId('progress').setAttribute('aria-valuemax',String(max));byId('progress').setAttribute('aria-valuenow',String(done));byId('progress-count').textContent=done+'/'+max;refreshSend();}
let ink=false, active=false, last=null, pdf=null, url=null;
const canvas=byId('signature'),ctx=canvas.getContext('2d');
function dateLabel(){return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jerusalem',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date());}
byId('head-date').textContent=dateLabel();
function renderItems(){const page=pages[step];byId('form-title').textContent=page.title;const box=byId('items');box.replaceChildren();page.items.forEach((item,i)=>{const wrap=document.createElement('div');wrap.className='check-wrap';const row=document.createElement('div');row.className='check-item';row.dataset.checked=String(checks[step][i]);const mark=document.createElement('span');mark.className='check-box';mark.role='checkbox';mark.tabIndex=0;mark.setAttribute('aria-checked',String(checks[step][i]));mark.setAttribute('aria-label',item.text);const text=document.createElement('span');text.className='check-text';text.textContent=item.text;const problem=document.createElement('button');problem.type='button';problem.className='problem-box';problem.dataset.on=String(problems[step][i]);problem.setAttribute('aria-pressed',String(problems[step][i]));problem.setAttribute('aria-label','בעיה');problem.textContent=problems[step][i]?'\u2715':'';const note=document.createElement('textarea');note.className='problem-note';note.placeholder='תיאור הבעיה';note.value=notes[step][i]||'';note.hidden=!problems[step][i];function paint(){row.dataset.checked=String(checks[step][i]);mark.setAttribute('aria-checked',String(checks[step][i]));problem.dataset.on=String(problems[step][i]);problem.setAttribute('aria-pressed',String(problems[step][i]));problem.textContent=problems[step][i]?'\u2715':'';note.hidden=!problems[step][i];}function toggleOk(){checks[step][i]=!checks[step][i];paint();updateProgress();touchPage();}mark.onclick=e=>{e.stopPropagation();toggleOk();};text.onclick=toggleOk;mark.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();toggleOk();}};problem.onclick=e=>{e.stopPropagation();problems[step][i]=!problems[step][i];paint();touchPage();if(problems[step][i])note.focus();};note.oninput=()=>{notes[step][i]=note.value;touchPage();};row.append(mark,text,problem);wrap.append(row);if(item.sub){const ul=document.createElement('ul');ul.className='sub-list';item.sub.forEach(s=>{const li=document.createElement('li');li.textContent=s;ul.append(li);});wrap.append(ul);}wrap.append(note);box.append(wrap);});}

function restoreSignature(){const src=signatures[step];ink=!!src;if(!src){refreshSend();return;}const img=new Image();img.onload=()=>{const rect=canvas.getBoundingClientRect();if(!rect.width)return;ctx.drawImage(img,0,0,rect.width,rect.height);ink=true;refreshSend();};img.src=src;}

function placeDesktopMenu(){const menu=byId('nav-menu');const b=byId('menu-toggle').getBoundingClientRect();menu.style.top=Math.round(b.bottom-4)+'px';menu.style.right=Math.round(window.innerWidth-b.right)+'px';menu.style.left='auto';menu.style.bottom='auto';}

function openMenu(){menuCloseToken++;const menu=byId('nav-menu');menu.hidden=false;menu.classList.remove('is-closing');if(desktopMenu())placeDesktopMenu();else clearDesktopMenu();menu.classList.remove('is-open');void menu.offsetWidth;menu.classList.add('is-open');byId('menu-toggle').setAttribute('aria-expanded','true');}
function closeMenu(){const menu=byId('nav-menu');if(menu.hidden||menu.classList.contains('is-closing'))return;byId('menu-toggle').setAttribute('aria-expanded','false');const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;if(!desktopMenu()||reduce){menu.classList.remove('is-open','is-closing');menu.hidden=true;clearDesktopMenu();return;}menu.classList.remove('is-open');menu.classList.add('is-closing');const token=++menuCloseToken;let finished=false;const done=()=>{if(finished||token!==menuCloseToken)return;finished=true;menu.hidden=true;menu.classList.remove('is-closing');menu.removeEventListener('animationend',done);};menu.addEventListener('animationend',done);setTimeout(done,260);}
function touchPage(){submitted[step]=false;capturePage();persist();refreshSend();renderMenu();}
function placeThumb(){const sc=byId('form-scroll');const bar=byId('scroll-bar');const thumb=byId('scroll-thumb');const max=sc.scrollHeight-sc.clientHeight;if(max<=1){bar.hidden=true;return;}bar.hidden=false;const h=Math.max(36,Math.round(bar.clientHeight*(sc.clientHeight/sc.scrollHeight)));const travel=Math.max(0,bar.clientHeight-h);thumb.style.height=h+'px';thumb.style.transform='translateY('+(sc.scrollTop/max*travel)+'px)';}
function size(){const old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;old.getContext('2d').drawImage(canvas,0,0);const rect=canvas.getBoundingClientRect();if(!rect.width)return;const ratio=devicePixelRatio||1;canvas.width=Math.round(rect.width*ratio);canvas.height=Math.round(rect.height*ratio);ctx.scale(ratio,ratio);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#251f21';if(ink)ctx.drawImage(old,0,0,old.width,old.height,0,0,rect.width,rect.height);}
size();window.addEventListener('resize',()=>{if(!byId('form').hidden)size();});
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
canvas.onpointerdown=e=>{active=true;last=point(e);canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!active)return;const p=point(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;ink=true;};canvas.onpointerup=canvas.onpointercancel=()=>{active=false;last=null;if(ink){signatures[step]=canvas.toDataURL();submitted[step]=false;persist();renderMenu();}refreshSend();};

function pdfFileName(){return "צ'קליסט פתיחת חנות ROLEX "+dateLabel().replaceAll('/','.')+".pdf";}
function archiveDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open('rolex-checklist',1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('pdfs'))db.createObjectStore('pdfs',{keyPath:'date'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function savePdf(file){const db=await archiveDb();await new Promise((resolve,reject)=>{const tx=db.transaction('pdfs','readwrite');tx.objectStore('pdfs').put({date:dateLabel(),name:file.name,blob:file,savedAt:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});db.close();}
async function listPdfs(){const db=await archiveDb();const rows=await new Promise((resolve,reject)=>{const req=db.transaction('pdfs','readonly').objectStore('pdfs').getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);});db.close();return rows.sort((a,b)=>b.date.split('/').reverse().join('').localeCompare(a.date.split('/').reverse().join('')));}
let archivePreviewUrl='';
function viewPdf(blob){if(archivePreviewUrl)URL.revokeObjectURL(archivePreviewUrl);archivePreviewUrl=URL.createObjectURL(blob);const frame=byId('archive-frame');frame.hidden=false;frame.src=archivePreviewUrl;frame.scrollIntoView({block:'start'});}
function downloadPdf(blob,name){const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(href),1000);}
async function deletePdf(date){const db=await archiveDb();await new Promise((resolve,reject)=>{const tx=db.transaction('pdfs','readwrite');tx.objectStore('pdfs').delete(date);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});db.close();byId('archive-frame').hidden=true;await renderArchive();}
const archiveEye='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
const archiveDown='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const archiveTrash='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V5h6v2M8 7l1 13h6l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function archiveLabel(date){return 'Checklist '+date.replaceAll('/','.');}
async function renderArchive(){const rows=await listPdfs();const body=byId('archive-rows');body.replaceChildren();byId('archive-empty').hidden=rows.length>0;byId('archive-table').hidden=rows.length===0;for(const row of rows){const label=archiveLabel(row.date);const tr=document.createElement('tr');const file=document.createElement('td');file.className='archive-name';file.textContent=label;const actions=document.createElement('td');const wrap=document.createElement('div');wrap.className='archive-actions';const view=document.createElement('button');view.type='button';view.className='file-button archive-icon';view.setAttribute('aria-label','צפייה');view.innerHTML=archiveEye;view.onclick=()=>viewPdf(row.blob);const down=document.createElement('button');down.type='button';down.className='file-button archive-icon';down.setAttribute('aria-label','הורדה');down.innerHTML=archiveDown;down.onclick=()=>downloadPdf(row.blob,label+'.pdf');const del=document.createElement('button');del.type='button';del.className='file-button archive-icon archive-delete';del.setAttribute('aria-label','מחיקה');del.innerHTML=archiveTrash;del.onclick=()=>deletePdf(row.date).catch(()=>{});wrap.append(del,view,down);actions.append(wrap);tr.append(file,actions);body.append(tr);}}
async function showArchive(){byId('form-screen').hidden=true;byId('form').hidden=true;byId('report').hidden=true;byId('archive').hidden=false;byId('archive-frame').hidden=true;await renderArchive();window.scrollTo(0,0);}
byId('archive-back').onclick=()=>{byId('archive').hidden=true;byId('form-screen').hidden=false;byId('form').hidden=false;window.scrollTo(0,0);if(!byId('form').hidden)size();};
async function sendChecklistEmail(pdfFile, employeeName){
  const data=new FormData();
  data.append("_subject", "צ'קליסט פתיחת חנות ROLEX "+dateLabel());
  data.append("_captcha", "false");
  data.append("_template", "box");
  data.append("שם העובד", employeeName);
  const logoBlob=await (await fetch(logo.src)).blob();
  data.append("attachment", new File([logoBlob], "the-masters-logo.png", {type:logoBlob.type||"image/png"}));
  data.append("attachment", pdfFile, pdfFile.name);
  const res=await fetch("https://formsubmit.co/ajax/ivadimus@gmail.com", {method:"POST", headers:{Accept:"application/json"}, body:data, referrerPolicy:"origin"});
  const payload=await res.json().catch(()=>({}));
  if(!res.ok || !/^true$/i.test(String(payload.success))){
    const message=String(payload.message||"");
    if(/activat/i.test(message)) throw new Error("activation");
    if(/web server|html file/i.test(message)) throw new Error("file");
    throw new Error("send");
  }
}
function nameIsValid(value){const name=value.trim();if(!/^[\p{L}][\p{L} .'-]*[\p{L}]$/u.test(name))return false;const letters=name.match(/\p{L}/gu)||[];if(letters.length<=3)return false;if(/(.)\1/u.test(letters.join('')))return false;if(/^\d+$/.test(name))return false;return true;}
function formReady(){return nameIsValid(byId('name').value)&&checks[step].every(Boolean)&&problems[step].every((on,i)=>!on||String(notes[step][i]||'').trim())&&!!ink;}
function refreshSend(){const ready=formReady();byId('build').classList.toggle('send-disabled',!ready);byId('build').setAttribute('aria-disabled',String(!ready));if(ready&&byId('form-note').textContent==='נא למלא את כל הפרטים')byId('form-note').textContent='';}
byId('name').oninput=()=>{const value=byId('name').value.trim();byId('name-error').hidden=!value||nameIsValid(value);names[step]=byId('name').value;submitted[step]=false;persist();refreshSend();renderMenu();};
async function sigImage(src){if(!src)return null;const img=new Image();img.src=src;await img.decode();return img;}
async function buildForms(indexes){capturePage();await logo.decode();const forms=[];for(const pi of indexes){forms.push({title:pages[pi].title,items:pages[pi].items,checks:checks[pi],problems:problems[pi],notes:notes[pi],name:(names[pi]||'').trim(),signature:await sigImage(signatures[pi])});}return ChecklistPdf.buildChecklistReport({dateLabel:dateLabel(),logo,forms});}
async function downloadForm(pi){const report=await buildForms([pi]);downloadPdf(report.blob,'Checklist '+menuLabels[pi]+' '+dateLabel().replaceAll('/','.')+'.pdf');}
async function downloadDaily(){const report=await buildForms(pages.map((_,i)=>i));const name=archiveLabel(dateLabel())+'.pdf';downloadPdf(report.blob,name);try{await savePdf(new File([report.blob],name,{type:'application/pdf'}));}catch(e){}}
byId('build').onclick=async()=>{capturePage();const name=byId('name').value.trim();if(!formReady()){byId('name-error').hidden=nameIsValid(name);byId('form-note').textContent='נא למלא את כל הפרטים';return;}submitted[step]=true;persist();renderMenu();refreshSend();if(!submitted.every(Boolean)){byId('form-note').textContent='הטופס נשמר';return;}byId('build').disabled=true;try{const report=await buildForms(pages.map((_,i)=>i));const file=new File([report.blob],archiveLabel(dateLabel())+'.pdf',{type:'application/pdf'});await savePdf(file);byId('form-note').textContent='כל הטפסים נשמרו בארכיון';}catch(e){byId('form-note').textContent='השמירה נכשלה';}finally{byId('build').disabled=false;refreshSend();}};
byId('share').onclick=async()=>{try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[pdf]}))await navigator.share({files:[pdf],title:"צ'קליסט פתיחת חנות ROLEX"});}catch(e){}};
byId('print').onclick=()=>window.print();byId('back').onclick=()=>{byId('report').hidden=true;byId('archive').hidden=true;byId('form-screen').hidden=false;byId('form').hidden=false;window.scrollTo(0,0);if(!byId('sign-section').hidden)size();};byId('form-scroll').onscroll=placeThumb;window.addEventListener('resize',placeThumb);byId('scroll-bar').onpointerdown=e=>{const bar=byId('scroll-bar');const sc=byId('form-scroll');const move=ev=>{const r=bar.getBoundingClientRect();const ratio=Math.min(1,Math.max(0,(ev.clientY-r.top)/r.height));sc.scrollTop=ratio*(sc.scrollHeight-sc.clientHeight);};move(e);bar.setPointerCapture(e.pointerId);bar.onpointermove=move;bar.onpointerup=()=>{bar.onpointermove=null;};};byId('menu-toggle').onclick=()=>{if(byId('nav-menu').hidden)openMenu();else closeMenu();};document.addEventListener('pointerdown',e=>{const menu=byId('nav-menu');if(menu.hidden||!desktopMenu())return;if(menu.contains(e.target)||byId('menu-toggle').contains(e.target))return;closeMenu();});window.addEventListener('resize',()=>{if(!byId('nav-menu').hidden&&desktopMenu())placeDesktopMenu();});byId('menu-close').onclick=closeMenu;byId('menu-archive').onclick=()=>{closeMenu();showArchive().catch(()=>{});};byId('daily-report').onclick=()=>downloadDaily().catch(()=>{});loadDay();showStep(0);
</script></body></html>
